<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" fill="none" role="img" aria-label="دُغْري Daghri">
  <!-- دُغْري Daghri — الشعار الأفقي: علامة السكوتر + الاسم بالعربية واللاتينية -->
  <defs>
    <linearGradient id="dgbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B4E"/>
      <stop offset="1" stop-color="#FF8F70"/>
    </linearGradient>
  </defs>
  <!-- البلاغة المربّعة -->
  <rect x="8" y="24" width="152" height="152" rx="36" fill="url(#dgbg)"/>
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <path d="M63 89 L112 40"/>
    <path d="M86 89 L67 89"/>
    <path d="M86 89 L108 89"/>
    <path d="M86 89 L86 37"/>
    <path d="M75 37 L127 37"/>
    <path d="M41 89 L41 78"/>
  </g>
  <circle cx="42" cy="105" r="22" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="42" cy="105" r="8" fill="#1A2B45"/>
  <circle cx="105" cy="105" r="22" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="105" cy="105" r="8" fill="#1A2B45"/>
  <rect x="23" y="47" width="37" height="32" rx="7" fill="#FFFFFF"/>
  <rect x="39" y="50" width="5" height="27" fill="#1A2B45"/>
  <!-- الاسم العربي دُغْري -->
  <text x="452" y="92" text-anchor="end" font-family="Cairo, 'Noto Sans Arabic', sans-serif" font-size="64" font-weight="800" fill="#1A2B45">دُغْري</text>
  <!-- الاسم اللاتيني DAGHRI -->
  <text x="452" y="130" text-anchor="end" font-family="Poppins, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="9" fill="#26A69A">DAGHRI</text>
  <!-- خط تحت -->
  <rect x="290" y="146" width="162" height="7" rx="3.5" fill="#FF6B4E"/>
  <text x="452" y="178" text-anchor="end" font-family="Cairo, 'Noto Sans Arabic', sans-serif" font-size="17" font-weight="600" fill="#1A2B45" opacity="0.8">توصيل أسرع وأسهل — دُغْري!</text>
</svg>
